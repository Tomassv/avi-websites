<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body { background: #fff; }
        .page { padding: 20px 16px 24px; max-width: 100%; }
    </style>
</head>
<body>
    <main class="page">
        <article class="chat-bubble chat-bubble-assistant">Hi Thomas, we are really sorry your flight was disrupted and had to be cancelled. We know this is stressful, and we are here to help you all the way through.</article>
        <div style="height: 8px;"></div>
        <article class="chat-bubble chat-bubble-assistant">Here below, we prepared some options for you. Please do not hesitate to ask anything at any time.</article>
        <div class="chat-options-wrap">
            <p class="chat-options-label">Your options:</p>
            <div class="chat-options">
                <button type="button" class="option-card">
                    <span class="option-number">1.</span>
                    <span class="option-title">Next available flight
                        <span class="option-detail">Move to the first available departure and keep traveling today.</span>
                    </span>
                    <span class="option-button">keyboard_arrow_right</span>
                </button>
                <button type="button" class="option-card">
                    <span class="option-number">2.</span>
                    <span class="option-title">New flight within next 90 days
                        <span class="option-detail">Pick another travel date in the next 90 days with no change fee.</span>
                    </span>
                    <span class="option-button">keyboard_arrow_right</span>
                </button>
                <button type="button" class="option-card">
                    <span class="option-number">3.</span>
                    <span class="option-title">Cancel flight and get 100% refund
                        <span class="option-detail">Cancel this disrupted trip and receive your full ticket amount back.</span>
                    </span>
                    <span class="option-button">keyboard_arrow_right</span>
                </button>
            </div>
        </div>
    </main>
</body>
</html>

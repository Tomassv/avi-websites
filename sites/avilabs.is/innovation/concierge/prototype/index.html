<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Rebooking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="page">
        <header class="hero">
            <p class="eyebrow">Travel support</p>
            <h1>Your flight was cancelled</h1>
        </header>

        <section class="section-card top-card" id="flight-card" aria-label="Flight details">
            <div class="flight-card">
                <div class="status-row">
                    <span class="status-tag">Cancelled</span>
                    <span class="ref">Booking ref: AC72P9</span>
                </div>

                <div class="route-row">
                    <div class="airport">
                        <p class="code">MEL</p>
                        <p class="city">Melbourne</p>
                        <p class="time"><s>06:05am</s></p>
                    </div>

                    <div class="connector" aria-hidden="true">
                        <span class="line"></span>
                        <span class="plane"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="14" viewBox="0 0 16 14" fill="none">
                                <g clip-path="url(#clip0_1_11)">
                                    <path d="M3.19999 5.7L7.79999 5.5L4.79999 -0.300003L6.39999 -0.200003L11 5.4H14.3C14.4 5.4 14.6 5.5 14.7 5.5C15.1 5.7 15.3 6.2 15 6.5C14.9 6.7 14.7 6.8 14.5 6.8L11.1 7L6.59999 12.6H5.19999L7.79999 6.8L3.29999 6.7L2.09999 8.4H0.999994L1.59999 6.2L0.899994 4H1.79999L3.19999 5.7Z" fill="#8D8F92" />
                                </g>
                                <defs>
                                    <clipPath id="clip0_1_11">
                                        <rect width="16" height="14" fill="white" />
                                    </clipPath>
                                </defs>
                            </svg>
                        </span>
                    </div>

                    <div class="airport right">
                        <p class="code">BNE</p>
                        <p class="city">Brisbane</p>
                        <p class="time"><s>08:20am</s></p>
                    </div>
                </div>

                <div class="meta-grid">
                    <div>
                        <p class="label">Date</p>
                        <p class="value">12 June 2026</p>
                    </div>
                    <div>
                        <p class="label">Flight</p>
                        <p class="value">JQ560</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-card chat-section" aria-label="AI support chat">
            <div id="ai-chat-log" class="chat-log" aria-live="polite">
                <article class="chat-bubble chat-bubble-typing" id="typing-indicator">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </article>
                <article class="chat-bubble chat-bubble-assistant hidden" id="intro-bubble"></article>
                <article class="chat-bubble chat-bubble-assistant hidden" id="intro-followup"></article>

                <div class="chat-options-wrap hidden" aria-label="Rebooking options from assistant" id="chat-options-wrap">
                    <p class="chat-options-label">Your options:</p>
                    <div id="rebooking-options" class="chat-options">
                        <button type="button" class="option-card" aria-label="Go to next available flight proposal" data-chat-option="next-available">
                            <span class="option-number">1.</span>
                            <span class="option-title">Next available flight
                                <span class="option-detail">Move to the first available departure and keep traveling today.</span>
                            </span>
                            <span class="option-button">keyboard_arrow_right</span>
                        </button>
                        <button type="button" class="option-card" aria-label="Choose a new flight within next 90 days option" data-chat-option="within-90-days">
                            <span class="option-number">2.</span>
                            <span class="option-title">New flight within next 90 days
                                <span class="option-detail">Pick another travel date in the next 90 days with no change fee.</span>
                            </span>
                            <span class="option-button">keyboard_arrow_right</span>
                        </button>
                        <button type="button" class="option-card" aria-label="Choose cancel flight and full refund option" data-chat-option="full-refund">
                            <span class="option-number">3.</span>
                            <span class="option-title">Cancel flight and get 100% refund
                                <span class="option-detail">Cancel this disrupted trip and receive your full ticket amount back.</span>
                            </span>
                            <span class="option-button">keyboard_arrow_right</span>
                        </button>
                    </div>
                </div>
            </div>

            <form id="ai-chat-form" class="chat-form">
                <div class="chat-form-wrapper">
                    <input id="ai-chat-input" name="message" type="text" autocomplete="off" placeholder="Ask for details..." aria-label="Write message" required />
                    <button type="submit" class="chat-send" aria-label="Send message">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18">
                            <path d="M12 4L6 10H10V20H14V10H18L12 4Z" fill="currentColor" />
                        </svg>
                    </button>
                </div>
            </form>
        </section>
    </main>



    <script>
        const chatLog = document.getElementById("ai-chat-log");
        const chatForm = document.getElementById("ai-chat-form");
        const chatInput = document.getElementById("ai-chat-input");
        const optionCards = document.querySelectorAll("[data-chat-option]");
        let passengerEmail = "";
        let awaitingNextFlightEmail = false;
        let awaitingCompensationIncident = false;
        let awaitingCompensationAmount = false;
        let compensationIncidentDetails = "";
        let requestedCompensationAmount = 0;

        function deliveryEmailLabel() {
            return passengerEmail || "your booking email";
        }

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        function showNextAvailableFlightFlow(emailLabel) {
            if (emailLabel) {
                const bubble1 = document.createElement("article");
                bubble1.className = "chat-bubble chat-bubble-assistant";
                chatLog.appendChild(bubble1);
                typeWriter(bubble1, `Thanks. We will send the update to ${emailLabel}.`, () => {
                    const bubble2 = document.createElement("article");
                    bubble2.className = "chat-bubble chat-bubble-assistant";
                    chatLog.appendChild(bubble2);
                    typeWriter(bubble2, "We have also sent a <strong>20 EUR meal voucher</strong> to your email for Melbourne Airport (MEL). You can use it at:<ul class=\"chat-itinerary-list\"><li>Runway Kitchen</li><li>Terminal Grill</li><li>Green Bowl Kitchen</li><li>Pasta Gate</li><li>Skyline Cafe</li></ul>", () => {
                        const bubble3 = document.createElement("article");
                        bubble3.className = "chat-bubble chat-bubble-assistant";
                        chatLog.appendChild(bubble3);
                        typeWriter(bubble3, "Here is the next available flight for your route:", () => {
                            scrollToBottom();
                            appendFlightCard();
                        });
                        scrollToBottom();
                    }, true);
                    scrollToBottom();
                });
                scrollToBottom();
            } else {
                const bubble = document.createElement("article");
                bubble.className = "chat-bubble chat-bubble-assistant";
                chatLog.appendChild(bubble);
                typeWriter(bubble, "Great choice! Here is the next available flight for your route:", () => {
                    scrollToBottom();
                    appendFlightCard();
                });
                scrollToBottom();
            }
        }

        // --- intro animation ---
        const introText = "Hi Thomas, we are really sorry your flight was disrupted and had to be cancelled. We know this is stressful, and we are here to help you all the way through.";
        const typingEl = document.getElementById("typing-indicator");
        const introBubble = document.getElementById("intro-bubble");
        const introFollowup = document.getElementById("intro-followup");
        const optionsWrap = document.getElementById("chat-options-wrap");

        function typeWriter(el, text, done, isHTML = false) {
            let i = 0;
            el.classList.remove('hidden');
            const interval = setInterval(() => {
                if (isHTML) {
                    el.innerHTML = text.slice(0, ++i);
                } else {
                    el.textContent = text.slice(0, ++i);
                }
                scrollToBottom("auto");
                if (i === text.length) { clearInterval(interval); done?.(); }
            }, 22);
        }

        setTimeout(() => {
            typingEl.classList.add('hidden');
            typeWriter(introBubble, introText, () => {
                typeWriter(introFollowup, "Here below, we prepared some options for you. Please do not hesitate to ask anything at any time.", () => {
                    optionsWrap.classList.remove('hidden');
                    scrollToBottom("smooth");
                    const cards = document.querySelectorAll(".option-card");
                    cards.forEach((card, i) => {
                        card.classList.add('animate-in');
                        setTimeout(() => {
                            card.classList.add('is-visible');
                            scrollToBottom("smooth");
                        }, i * 120);
                    });
                });
            });
        }, 1400);

        function scrollToBottom(behavior = "smooth") {
            window.scrollTo({ top: document.body.scrollHeight, behavior });
        }

        function appendMessage(text, role) {
            const bubble = document.createElement("article");
            bubble.className = `chat-bubble ${role === "user" ? "chat-bubble-user" : "chat-bubble-assistant"}`;
            bubble.textContent = text;
            chatLog.appendChild(bubble);
            scrollToBottom();
            return bubble;
        }

        function submitUserMessage(message) {
            const trimmedMessage = message.trim();

            if (!trimmedMessage) {
                return;
            }

            appendMessage(trimmedMessage, "user");
            chatInput.value = "";
            assistantReply(trimmedMessage);
        }

        function appendTyping() {
            const bubble = document.createElement("article");
            bubble.className = "chat-bubble chat-bubble-typing";
            bubble.innerHTML = "<span class='dot'></span><span class='dot'></span><span class='dot'></span>";
            chatLog.appendChild(bubble);
            scrollToBottom();
            return bubble;
        }

        function withTyping(delay, onDone) {
            const typing = appendTyping();
            setTimeout(() => {
                typing.remove();
                onDone();
            }, delay);
        }

        function lockActionGroup(group, selector) {
            group.dataset.resolved = "true";
            group.querySelectorAll(selector).forEach((button) => {
                button.disabled = true;
                button.classList.add("is-disabled");
            });
        }

        function appendFlightCard() {
            const wrap = document.createElement("div");
            wrap.className = "chat-flight-card animate-in";
            wrap.innerHTML = `
                <div class="chat-flight-header">
                    <span class="status-tag status-tag-new">New flight</span>
                    <span class="ref">JQ 562 &middot; 12 Jun 2026</span>
                </div>
                <div class="route-row">
                    <div class="airport">
                        <p class="code">MEL</p>
                        <p class="city">Melbourne</p>
                        <p class="time">11:15</p>
                    </div>
                    <div class="connector" aria-hidden="true">
                        <span class="line"></span>
                        <span class="plane">✈</span>
                    </div>
                    <div class="airport right">
                        <p class="code">BNE</p>
                        <p class="city">Brisbane</p>
                        <p class="time">13:20</p>
                    </div>
                </div>
                <div class="chat-flight-actions">
                    <button type="button" class="cta cta-sm" data-chat-flight-action="accept">Accept change</button>
                    <button type="button" class="cta-secondary cta-sm" data-chat-flight-action="reject">Reject</button>
                </div>
            `;
            chatLog.appendChild(wrap);
            scrollToBottom();
            requestAnimationFrame(() => requestAnimationFrame(() => {
                wrap.classList.add('is-visible');
                scrollToBottom();
            }));
        }

        function appendFlightResultCard() {
            const result = document.createElement("div");
            result.className = "chat-flight-result chat-flight-result-confirmed";
            result.innerHTML = `
                <p class="chat-confirmed-banner">Flight confirmed</p>
                <p class="chat-flight-result-title">Flight change confirmed</p>
                <p class="chat-flight-result-text">Your new itinerary is confirmed and ready for travel.</p>

                <div class="chat-result-grid" aria-label="Confirmed flight summary">
                    <p><span class="result-key">Booking ref</span><span class="result-value">AC72P9</span></p>
                    <p><span class="result-key">Flight</span><span class="result-value">JQ 562</span></p>
                    <p><span class="result-key">Route</span><span class="result-value">MEL -> BNE</span></p>
                    <p><span class="result-key">Date</span><span class="result-value">12 Jun 2026</span></p>
                    <p><span class="result-key">Departure</span><span class="result-value">11:15</span></p>
                    <p><span class="result-key">Arrival</span><span class="result-value">13:20</span></p>
                </div>

                <div class="chat-result-block" aria-label="Airport timeline">
                    <p class="result-block-title">Airport timeline</p>
                    <p class="chat-flight-result-text">Check-in opens: <strong>04:20</strong></p>
                    <p class="chat-flight-result-text">Bag drop closes: <strong>10:40</strong></p>
                    <p class="chat-flight-result-text">Boarding: <strong>10:50</strong> at gate <strong>A22</strong>, terminal <strong>T3</strong></p>
                </div>

                <div class="chat-result-block" aria-label="Travel information">
                    <p class="result-block-title">Travel information</p>
                    <p class="chat-flight-result-text">Passenger: <strong>Thomas Nielsen</strong></p>
                    <p class="chat-flight-result-text">Baggage: <strong>1 cabin bag + 1 personal item</strong>. Checked baggage unchanged from original ticket.</p>
                </div>
            `;
            chatLog.appendChild(result);
            scrollToBottom();
        }

        function appendHotelQuestionMessage() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(question, "Your new flight departs in about 24 hours. Do you need a hotel for tonight?", () => {
                const buttons = document.createElement("div");
                buttons.className = "chat-hotel-actions";
                buttons.setAttribute("data-hotel-action-group", "true");
                buttons.innerHTML = `
                    <button type="button" class="chat-hotel-btn" data-chat-hotel-action="yes">Yes, I need a hotel <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-chat-hotel-action="no">No, I do not need one <span class="option-button">keyboard_arrow_right</span></button>
                `;
                question.appendChild(buttons);
                scrollToBottom();
            });
            scrollToBottom();
        }

        function appendHotelOfferCard() {
            const hotels = [
                {
                    name: "Comfort Airport Hotel Melbourne",
                    area: "Near MEL Airport",
                    checkIn: "29 Apr 2026, 15:00",
                    checkOut: "30 Apr 2026, 09:00",
                    room: "Standard Double",
                    board: "Breakfast included",
                    image: "https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=640&h=360&fit=crop&auto=format",
                },
                {
                    name: "Skyline Stay MEL",
                    area: "8 min from terminal",
                    checkIn: "29 Apr 2026, 14:30",
                    checkOut: "30 Apr 2026, 10:00",
                    room: "Twin Room",
                    board: "Dinner + breakfast",
                    image: "https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=640&h=360&fit=crop&auto=format",
                },
                {
                    name: "Nordic Harbour Hotel",
                    area: "Airport district",
                    checkIn: "29 Apr 2026, 15:00",
                    checkOut: "30 Apr 2026, 11:00",
                    room: "Queen Room",
                    board: "Breakfast included",
                    image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=640&h=360&fit=crop&auto=format",
                },
            ];

            const offer = document.createElement("div");
            offer.className = "chat-hotel-offers-wrap animate-in";
            offer.innerHTML = `
                <div class="chat-hotel-offers-row" data-chat-hotel-offer-group="true">
                    ${hotels
                    .map(
                        (hotel) => `
                        <article class="chat-hotel-offer-card">
                            <img class="chat-hotel-photo" src="${hotel.image}" alt="${hotel.name}" loading="lazy" decoding="async" />
                            <div class="chat-flight-header">
                                <span class="ref">1 night &middot; ${hotel.area}</span>
                            </div>
                            <p class="chat-hotel-name">${hotel.name}</p>
                            <div class="chat-result-grid" aria-label="Hotel offer summary">
                                <p><span class="result-key">Check-in</span><span class="result-value">${hotel.checkIn}</span></p>
                                <p><span class="result-key">Check-out</span><span class="result-value">${hotel.checkOut}</span></p>
                                <p><span class="result-key">Room</span><span class="result-value">${hotel.room}</span></p>
                                <p><span class="result-key">Board basis</span><span class="result-value">${hotel.board}</span></p>
                            </div>
                            <div class="chat-flight-actions">
                                <button type="button" class="cta cta-xs" data-chat-hotel-offer-action="accept" data-chat-hotel-name="${hotel.name}">Choose this hotel</button>
                            </div>
                        </article>
                    `
                    )
                    .join("")}
                </div>
                <div class="chat-hotel-offers-footer">
                    <button type="button" class="cta-secondary cta-sm" data-chat-hotel-offer-action="reject">No hotel needed</button>
                </div>
            `;
            chatLog.appendChild(offer);
            scrollToBottom();
            requestAnimationFrame(() => requestAnimationFrame(() => {
                offer.classList.add('is-visible');
                scrollToBottom();
            }));
        }

        function appendHotelConfirmedCard(hotelName) {
            const result = document.createElement("div");
            result.className = "chat-flight-result chat-hotel-result-confirmed";
            result.innerHTML = `
                <p class="chat-confirmed-banner">Hotel confirmed</p>
                <p class="chat-flight-result-title">Hotel voucher confirmed</p>
                <p class="chat-flight-result-text">Your hotel stay is confirmed. The voucher and directions have been sent to <strong>${deliveryEmailLabel()}</strong>.</p>

                <div class="chat-result-grid" aria-label="Confirmed hotel summary">
                    <p><span class="result-key">Hotel</span><span class="result-value">${hotelName}</span></p>
                    <p><span class="result-key">Nights</span><span class="result-value">1 night</span></p>
                    <p><span class="result-key">Check-in</span><span class="result-value">29 Apr 2026, 15:00</span></p>
                    <p><span class="result-key">Check-out</span><span class="result-value">30 Apr 2026, 09:00</span></p>
                </div>
            `;
            chatLog.appendChild(result);
            scrollToBottom();
        }

        function appendClaimInfoCard() {
            const card = document.createElement("div");
            card.className = "chat-flight-result chat-passenger-plan";
            card.innerHTML = `
                <p class="chat-flight-result-title">About your compensation claim</p>
                <ul class="chat-itinerary-list">
                    <li><strong>EU261 eligibility:</strong> This flight is <strong>not eligible</strong> for financial compensation under EU Regulation 261/2004.</li>
                    <li>The cancellation was caused by <strong>severe weather conditions in Brisbane (BNE)</strong>, which is classified as an extraordinary circumstance outside airline control.</li>
                    <li><strong>Meal and accommodation reimbursement:</strong> Not applicable for an additional claim, as both a meal voucher and hotel accommodation are already being provided to you directly here.</li>
                    <li><strong>Right to care:</strong> You are entitled to the rebooking or full refund options already offered above.</li>
                    <li>If you believe your situation differs or wish to formally register a claim anyway, you can do so below.</li>
                </ul>
                <div class="chat-flight-actions">
                    <button type="button" class="cta-secondary cta-sm" data-claim-start="true">Start your claim</button>
                </div>
            `;
            chatLog.appendChild(card);
            scrollToBottom();
        }

        function appendClaimFlightQuestion() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(question, "Is this claim regarding your cancelled flight from MEL to BNE?", () => {
                const buttons = document.createElement("div");
                buttons.className = "chat-hotel-actions";
                buttons.setAttribute("data-claim-flight-group", "true");
                buttons.innerHTML = `
                    <button type="button" class="chat-hotel-btn" data-claim-flight="yes">Yes <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-claim-flight="no">No <span class="option-button">keyboard_arrow_right</span></button>
                `;
                question.appendChild(buttons);
                scrollToBottom();
            });
            scrollToBottom();
        }

        function appendClaimTypeQuestion() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(question, "What type of claim would you like to file?", () => {
                const buttons = document.createElement("div");
                buttons.className = "chat-hotel-actions";
                buttons.setAttribute("data-claim-type-group", "true");
                buttons.innerHTML = `
                    <button type="button" class="chat-hotel-btn" data-claim-type="flight-issue">Flight issue <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-claim-type="baggage-issue">Baggage issue <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-claim-type="other-issue">Other issue <span class="option-button">keyboard_arrow_right</span></button>
                `;
                question.appendChild(buttons);
                scrollToBottom();
            });
            scrollToBottom();
        }

        function appendClaimRequestQuestion() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(question, "What do you request?", () => {
                const buttons = document.createElement("div");
                buttons.className = "chat-hotel-actions";
                buttons.setAttribute("data-claim-request-group", "true");
                buttons.innerHTML = `
                    <button type="button" class="chat-hotel-btn" data-claim-request="feedback">Provide feedback <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-claim-request="ticket-refund">Ticket refund <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-claim-request="compensation">Compensation <span class="option-button">keyboard_arrow_right</span></button>
                `;
                question.appendChild(buttons);
                scrollToBottom();
            });
            scrollToBottom();
        }

        function appendMoneyRefundOptions() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(
                question,
                "If you would like a full refund, please confirm below and we will process it within 7 days. Prefer travel credit instead? Select Ask for credit to receive credit plus an extra 30% for your next flight.",
                () => {
                    const buttons = document.createElement("div");
                    buttons.className = "chat-hotel-actions";
                    buttons.setAttribute("data-money-action-group", "true");
                    buttons.innerHTML = `
                        <button type="button" class="chat-hotel-btn" data-money-action="ask-credit"><span class="btn-badge">Most Popular</span> Ask for credit (+30% bonus) <span class="option-button">keyboard_arrow_right</span></button>
                        <button type="button" class="chat-hotel-btn" data-money-action="confirm-refund">Confirm full refund <span class="option-button">keyboard_arrow_right</span></button>
                    `;
                    question.appendChild(buttons);
                    scrollToBottom();
                }
            );
            scrollToBottom();
        }

        function appendCompensationChoiceQuestion() {
            const question = document.createElement("article");
            question.className = "chat-bubble chat-bubble-assistant";
            chatLog.appendChild(question);
            typeWriter(question, "Under EU regulation, the standard compensation limit in this flow is 200 EUR. Would you like to claim 200 EUR, or continue with a higher amount and upload proof of expenses?", () => {
                const buttons = document.createElement("div");
                buttons.className = "chat-hotel-actions";
                buttons.setAttribute("data-compensation-choice-group", "true");
                buttons.innerHTML = `
                    <button type="button" class="chat-hotel-btn" data-compensation-choice="claim-200">Claim 200 EUR <span class="option-button">keyboard_arrow_right</span></button>
                    <button type="button" class="chat-hotel-btn" data-compensation-choice="claim-higher">Claim higher amount (upload proof) <span class="option-button">keyboard_arrow_right</span></button>
                `;
                question.appendChild(buttons);
                scrollToBottom();
            });
            scrollToBottom();
        }

        function appendPassengerItineraryOverview() {
            const plan = document.createElement("div");
            plan.className = "chat-flight-result chat-passenger-plan";
            plan.innerHTML = `
                <p class="chat-flight-result-title">Your step-by-step plan</p>
                <ul class="chat-itinerary-list">
                    <li>Choose one of these airport restaurants and use your <strong>meal voucher</strong>:</li>

        function assistantReply(input) {
            const rawValue = input.trim();
            const value = rawValue.toLowerCase();

            if (!value) {
                return;
            }

            if (awaitingCompensationIncident) {
                compensationIncidentDetails = rawValue;
                awaitingCompensationIncident = false;
                awaitingCompensationAmount = true;
                appendMessage("Thanks. How much EUR would you like to be compensated?", "assistant");
                return;
            }

            if (awaitingCompensationAmount) {
                const amountMatch = rawValue.replace(/,/g, ".").match(/\d+(?:\.\d+)?/);

                if (!amountMatch) {
                    appendMessage("Please enter the amount in EUR as a number, for example 180 or 200.", "assistant");
                    return;
                }

                const amount = Number(amountMatch[0]);

                if (!Number.isFinite(amount) || amount <= 0) {
                    appendMessage("Please enter a valid amount greater than 0 EUR.", "assistant");
                    return;
                }

                requestedCompensationAmount = amount;
                awaitingCompensationAmount = false;

                if (amount > 200) {
                    appendMessage("Thanks. Because this is above 200 EUR, EU regulation requires additional proof of expenses.", "assistant");
                    appendCompensationChoiceQuestion();
                    return;
                }

                appendMessage(`Your compensation request for ${amount.toFixed(2)} EUR has been submitted for: ${compensationIncidentDetails}. We will review your case and send confirmation to ${deliveryEmailLabel()}.`, "assistant");
                return;
            }

            if (awaitingNextFlightEmail) {
                if (!isValidEmail(rawValue)) {
                    appendMessage("Please enter a valid email address, for example name@example.com.", "assistant");
                    return;
                }

                passengerEmail = rawValue;
                awaitingNextFlightEmail = false;
                chatInput.placeholder = "Ask for details...";
                showNextAvailableFlightFlow(passengerEmail);
                return;
            }

            if (value === "1" || value.includes("next") || value.includes("available")) {
                if (!passengerEmail) {
                    awaitingNextFlightEmail = true;
                    chatInput.placeholder = "Eg.: email@email.com";
                    const bubble = document.createElement("article");
                    bubble.className = "chat-bubble chat-bubble-assistant";
                    chatLog.appendChild(bubble);
                    typeWriter(bubble, "Before we continue, please provide your <strong>email address</strong> below for confirmation.", () => {
                        scrollToBottom();
                    }, true);
                    scrollToBottom();
                    return;
                }

                showNextAvailableFlightFlow();
                return;
            }

            if (value === "2" || value.includes("90") || value.includes("days")) {
                appendMessage(
                    "You can rebook any same-route flight within 90 days with no change fee. Keep your booking reference and we will show eligible departures.",
                    "assistant"
                );
                return;
            }

            if (value.includes("money")) {
                appendMoneyRefundOptions();
                return;
            }

            if (value === "3" || value.includes("refund") || value.includes("cancel")) {
                appendMessage(
                    "A 100% refund returns to your original payment method, usually within 3 to 5 business days. Reply with Confirm refund if you want to start it.",
                    "assistant"
                );
                return;
            }

            if (value.includes("confirm refund")) {
                appendMessage(
                    "Your full refund request is submitted. You will receive a confirmation email shortly.",
                    "assistant"
                );
                return;
            }

            if (value.includes("claim") || value.includes("compensation") || value.includes("eu261")) {
                const bubble = document.createElement("article");
                bubble.className = "chat-bubble chat-bubble-assistant";
                chatLog.appendChild(bubble);
                typeWriter(bubble, "I understand. Let me give you a clear overview of what applies to your situation.", () => {
                    scrollToBottom();
                    appendClaimInfoCard();
                });
                scrollToBottom();
                return;
            }

            if (value.includes("baggage") || value.includes("bag")) {
                appendMessage(
                    "Your baggage allowance stays the same as the original ticket unless you change cabin class.",
                    "assistant"
                );
                return;
            }

            appendMessage(
                "I can help with rebooking or refund. Type 1 for next available flight, 2 for rebooking within 90 days, or 3 for full refund details.",
                "assistant"
            );
        }

                    arrive: paymentGroup.dataset.altAirlineArrive || "",
                };
                const paymentAction = altAirlinePaymentButton.dataset.altAirlinePaymentAction;

                if (paymentAction === "confirm") {
                    appendMessage("Yes, charge my stored card", "user");
                    withTyping(650, () => {
                        appendMessage(
                            `Done. We charged your stored card for the additional ${airlineOption.difference} and booked ${airlineOption.carrier} ${airlineOption.flight}.`,
                            "assistant"
                        );
                        appendAlternativeAirlineConfirmedCard(airlineOption);
                        appendMessage(`We sent your updated flight details to ${deliveryEmailLabel()}.`, "assistant");
                    });
                    return;
                }

                appendMessage("No, not now", "user");
                withTyping(550, () => {
                    appendMessage("No problem. We did not charge your card, and your other rebooking and refund options remain available.", "assistant");
                });
                return;
            }

            const actionButton = event.target.closest("[data-chat-flight-action]");

            if (!actionButton) {
                return;
            }

            const flightCardEl = actionButton.closest(".chat-flight-card");

            if (!flightCardEl || flightCardEl.dataset.resolved === "true") {
                return;
            }

            lockActionGroup(flightCardEl, "[data-chat-flight-action]");

            const action = actionButton.dataset.chatFlightAction;

            if (action === "accept") {
                appendMessage("Accept change", "user");
                const bubble1 = document.createElement("article");
                bubble1.className = "chat-bubble chat-bubble-assistant";
                chatLog.appendChild(bubble1);
                typeWriter(bubble1, "Done. Your flight change is confirmed.", () => {
                    scrollToBottom();
                    appendFlightResultCard();
                    const bubble2 = document.createElement("article");
                    bubble2.className = "chat-bubble chat-bubble-assistant";
                    chatLog.appendChild(bubble2);
                    typeWriter(bubble2, `We sent your updated flight tickets to ${deliveryEmailLabel()}.`, () => {
                        scrollToBottom();
                        appendHotelQuestionMessage();
                    });
                    scrollToBottom();
                });
                scrollToBottom();
                return;
            }

            appendMessage("Reject change", "user");
            withTyping(700, () => {
                appendMessage("No problem. We can also check flights on different airlines.", "assistant");
                appendDifferentAirlineOffer();
            });
        });
    </script>
</body>

</html>
